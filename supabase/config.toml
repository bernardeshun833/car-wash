project_id = "kumasi-carwash-pos"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]

# Edge Functions. Secrets (MoMo, Resend, WhatsApp, the counting ingest secret)
# are set via `supabase secrets set` — never committed here.
[functions.momo-sync]
verify_jwt = false

[functions.nightly-reconciliation]
verify_jwt = false

# The counting agent has no Supabase account, so there is no JWT to verify.
# It authenticates with the X-Counting-Secret header instead; see the function.
[functions.vehicle-count-ingest]
verify_jwt = false
