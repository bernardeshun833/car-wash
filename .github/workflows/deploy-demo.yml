# Publishes the demo build to GitHub Pages.
#
# Why Pages rather than just opening the laptop's dev server on the phone:
# browsers only expose crypto.subtle and crypto.randomUUID in a "secure
# context" — HTTPS, or localhost. A phone loading http://192.168.x.x:5173 is
# neither, so PIN verification and id generation would fail with confusing
# errors. Pages gives a real HTTPS URL for free, which also means the phone can
# install it properly as a home-screen app.
#
# This deploys DEMO mode only: no Supabase, no keys, nothing secret. The real
# deployment is a separate host with its own environment variables.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main, claude/new-session-vnpecs]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The demo is only worth publishing if the logic behind it still holds.
      - run: npm test

      - run: npm run build:demo
        env:
          # GitHub Pages serves a project site from /<repo>/.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
